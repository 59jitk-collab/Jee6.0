name: Build JEE Study OS APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure Local .env Exists Without Secrets
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            echo "GEMINI_API_KEY=" > .env
          fi

      - name: Prepare Google Services Configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ ! -f "app/google-services.json" ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
              echo "Wrote app/google-services.json from GOOGLE_SERVICES_JSON secret."
            elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
              echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
              echo "Wrote app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret."
            else
              echo "::warning::app/google-services.json is missing and neither GOOGLE_SERVICES_JSON nor GOOGLE_SERVICES_JSON_BASE64 secret is configured. APK will build in offline-only mode without Firebase Cloud Sync."
            fi
          else
            echo "Found existing app/google-services.json."
          fi

      - name: Build debug APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JEE-Study-OS-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
